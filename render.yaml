services:
  - type: web
    name: asb001
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_SECRET_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
